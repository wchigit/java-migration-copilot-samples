# Kubernetes manifests for Asset Manager Application
apiVersion: v1
kind: Namespace
metadata:
  name: asset-manager
  labels:
    name: asset-manager
---
# ConfigMap for shared application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: asset-manager-config
  namespace: asset-manager
data:
  AZURE_STORAGE_ACCOUNT_NAME: "stie6nt"
  AZURE_STORAGE_BLOB_CONTAINER_NAME: "images"
  AZURE_SERVICEBUS_NAMESPACE: "sbie6nt"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pgie6nt.postgres.database.azure.com:5432/assets_manager?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "assetadmin"
  SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED: "false"
---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: asset-manager-secrets
  namespace: asset-manager
type: Opaque
data:
  AZURE_CLIENT_ID: ZWRmYmI3YmQtYTI0ZS00NWFmLWFhNzAtZTdiYjNjNjhiOTA4  # edfbb7bd-a24e-45af-aa70-e7bb3c68b908
  SPRING_DATASOURCE_PASSWORD: UEBzc3cwcmQxMjMh  # P@ssw0rd123!
---
# Deployment for Asset Manager Web Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-manager-web
  namespace: asset-manager
  labels:
    app: asset-manager-web
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asset-manager-web
  template:
    metadata:
      labels:
        app: asset-manager-web
        component: web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: asset-manager-workload-identity
      containers:
      - name: web
        image: acrie6nt.azurecr.io/asset-manager-web:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: asset-manager-secrets
              key: AZURE_CLIENT_ID
        - name: AZURE_STORAGE_ACCOUNT_NAME
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: AZURE_STORAGE_ACCOUNT_NAME
        - name: AZURE_STORAGE_BLOB_CONTAINER_NAME
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: AZURE_STORAGE_BLOB_CONTAINER_NAME
        - name: AZURE_SERVICEBUS_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: AZURE_SERVICEBUS_NAMESPACE
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: asset-manager-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
# Service for Asset Manager Web
apiVersion: v1
kind: Service
metadata:
  name: asset-manager-web-service
  namespace: asset-manager
  labels:
    app: asset-manager-web
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: asset-manager-web
---
# Deployment for Asset Manager Worker Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-manager-worker
  namespace: asset-manager
  labels:
    app: asset-manager-worker
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-manager-worker
  template:
    metadata:
      labels:
        app: asset-manager-worker
        component: worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: asset-manager-workload-identity
      containers:
      - name: worker
        image: acrie6nt.azurecr.io/asset-manager-worker:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: asset-manager-secrets
              key: AZURE_CLIENT_ID
        - name: AZURE_STORAGE_ACCOUNT_NAME
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: AZURE_STORAGE_ACCOUNT_NAME
        - name: AZURE_STORAGE_BLOB_CONTAINER_NAME
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: AZURE_STORAGE_BLOB_CONTAINER_NAME
        - name: AZURE_SERVICEBUS_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: AZURE_SERVICEBUS_NAMESPACE
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: asset-manager-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: asset-manager-config
              key: SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
# Service Account for Workload Identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: asset-manager-workload-identity
  namespace: asset-manager
  annotations:
    azure.workload.identity/client-id: edfbb7bd-a24e-45af-aa70-e7bb3c68b908
  labels:
    azure.workload.identity/use: "true"